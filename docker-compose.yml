services:
  minoowebcore:
    container_name: minoowebcore
    build:
      context: .
      dockerfile: Dockerfile
    image: minoowebcore:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # MinooConfiguration loads this file from AppDomain.CurrentDomain.BaseDirectory.
      - type: bind
        source: ./docker/config/AppConfig.json
        target: /app/AppConfig.json
        read_only: true
        bind:
          create_host_path: false
      # Keep application logs outside the container lifecycle.
      - minoo_logs:/app/Logs

volumes:
  minoo_logs:
